<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Proposals — Prosperity Olorunfemi</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Inter:wght@400;500&display=swap');
  :root{--bg:#0e0e11;--card:#16161a;--line:#26262c;--ink:#e8e8e8;--dim:#9a9aa2;--accent:#c8f04b}
  *{margin:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.65;
       display:flex;min-height:100vh;align-items:center;justify-content:center;padding:32px}
  main{max-width:620px;width:100%}
  .kicker{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.18em;text-transform:uppercase;
          color:var(--dim);margin-bottom:18px}
  h1{font-family:'Space Grotesk',sans-serif;font-size:34px;line-height:1.15;font-weight:700;letter-spacing:-.02em;margin-bottom:10px}
  p.lede{color:var(--dim);margin-bottom:28px}
  a.card{display:block;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:16px 18px;
         margin-bottom:10px;text-decoration:none;color:var(--ink);transition:border-color .15s ease}
  a.card:hover{border-color:var(--accent)}
  a.card b{font-family:'Space Grotesk',sans-serif;font-weight:500}
  a.card span{display:block;color:var(--dim);font-size:13px}
  footer{margin-top:28px;font-size:13px;color:var(--dim)}
  footer a{color:var(--accent);text-decoration:none}
</style>
</head>
<body>
<main>
  <div class="kicker">Founding-partner proposals</div>
  <h1>Prosperity Olorunfemi</h1>
  <p class="lede">Three one-page proposals, prepared October 2026.</p>
  <a class="card" href="pesa/"><b>Pesa</b><span>The infrastructure pivot needs a human story</span></a>
  <a class="card" href="evik/"><b>EvikNova</b><span>Launch narrative for the early-access phase</span></a>
  <a class="card" href="scale-army/"><b>Scale Army</b><span>A pilot + joint case study, not a retainer</span></a>
  <footer>Work: <a href="https://prosperityolorunfemi.vercel.app/">prosperityolorunfemi.vercel.app</a></footer>
</main>
</body>
</html>
